name: backend-tests

on:
  push:
    branches: [main]
  pull_request:
  # deploy.yml runs the same suites before building (a push to main is not gated by the PR's checks alone).
  workflow_call:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Only set for the postgres leg; conftest creates and drops a fresh database.
      TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg://postgres:dev@localhost:5432/postgres' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install libmagic
        run: sudo apt-get update && sudo apt-get install -y libmagic1
      - run: pip install -r requirements.txt
      - name: Alembic is consistent with the models (postgres leg)
        if: matrix.db == 'postgres'
        run: |
          pg_url="postgresql+psycopg://postgres:dev@localhost:5432/postgres"
          DATABASE_URL="$pg_url" alembic upgrade head
          DATABASE_URL="$pg_url" alembic check
      - run: pytest -q
