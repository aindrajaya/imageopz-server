# CORS Whitelist
map $http_origin $cors_origin {
    default                                        "";
    "~^https?://localhost(:[0-9]+)?$"              $http_origin;
    "~^https?://127\.0\.0\.1(:[0-9]+)?$"          $http_origin;
    "~^https://imageopz\.aindrajaya\.my\.id$"      $http_origin;
    "~^https://imageopz\.com$"                     $http_origin;
    "~^https://imageopz-api\.chainx\.engineer$"    $http_origin;
}

# Rate limit zones
# Note: browsers may send an OPTIONS preflight per upload request.
# Keep Nginx rate limits high enough that legitimate burst uploads don't get 429s;
# application-level quota enforcement happens in FastAPI.
limit_req_zone $binary_remote_addr zone=upload_zone:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=poll_zone:10m rate=240r/m;
limit_req_zone $binary_remote_addr zone=webhook_zone:10m rate=10r/m;

server {
    server_name imageopz-api.chainx.engineer;

    server_tokens off;
    client_max_body_size 1600M;
    client_body_buffer_size 1M;
    client_body_temp_path /tmp/nginx_upload;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;
    keepalive_timeout 65;

    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "DENY" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;

    location ~* ^/api/v1/optimize {
        limit_req zone=upload_zone burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
    }

    location ~* ^/api/v1/status {
        limit_req zone=poll_zone burst=120 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
    }

    location ~* ^/api/v1/webhooks {
        limit_req zone=webhook_zone burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/imageopz-api.chainx.engineer/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imageopz-api.chainx.engineer/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
